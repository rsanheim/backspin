name: Release

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  pull-requests: read

jobs:
  release:
    uses: rsanheim/.github/.github/workflows/gem-release.yml@6c5b50f8b2f73018bace3c4f51134dc3d6297b3d
    with:
      gem: backspin
      ruby-version: "4.0.0"
