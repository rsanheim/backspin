name: Release

on:
  workflow_dispatch:
    inputs:
      previous-ref:
        description: Tag or commit before the version increase (for retrying an unpublished release)
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: rsanheim/.github/.github/workflows/gem-release.yml@4ced52859dd60019b930a3f2023424e77b37ee2a
    with:
      gem: backspin
      ruby-version: "4.0.0"
