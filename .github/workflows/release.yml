name: Release

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: rsanheim/.github/.github/workflows/gem-release.yml@dcedb5aca59edd7dfc934da1473250e3036db1ff
    with:
      gem: backspin
      ruby-version: "4.0.0"
