# See: https://circleci.com/docs/configuration-reference
version: 2.1

orbs:
  # See: https://circleci.com/developer/orbs/orb/circleci/ruby
  ruby: circleci/ruby@2.5.3

jobs:
  test:
    resource_class: medium
    parameters:
      ruby-version:
        type: string
    docker:
      - image: cimg/ruby:<< parameters.ruby-version >>
    steps:
      - checkout
      - ruby/install-deps:
          key: gems-v1-ruby<< parameters.ruby-version >>
      - run:
          name: Run specs with Plur
          command: |
            set -euo pipefail
            mkdir -p tmp
            curl -fsSL https://github.com/jdx/mise/releases/download/v2026.9.15/install.sh -o tmp/mise-install.sh
            echo 'f4fbd60b2a68e6fd6a140ad5a36ac7acd4d74336123e614548f03083aa9c6bf4  tmp/mise-install.sh' | sha256sum -c -
            MISE_VERSION=v2026.9.15 sh tmp/mise-install.sh
            export PATH="$HOME/.local/bin:$PATH"
            mise trust
            mise upgrade github:rsanheim/plur
            # Keep the Ruby selected by the CircleCI matrix.
            MISE_DISABLE_TOOLS=ruby mise exec -- plur spec
      - run:
          name: Run fake gem specs
          command: bundle exec rake spec:fake_gem

  lint:
    resource_class: medium
    docker:
      - image: cimg/ruby:4.0
    steps:
      - checkout
      - ruby/install-deps:
          key: gems-v1-ruby4.0
      - run:
          name: Run Standard Ruby linter
          command: bundle exec rake standard

workflows:
  build:
    jobs:
      - test:
          matrix:
            parameters:
              ruby-version: ["3.2", "3.3", "3.4", "4.0"]
      - lint
