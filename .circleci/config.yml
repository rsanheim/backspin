# See: https://circleci.com/docs/configuration-reference
version: 2.1

orbs:
  # See: https://circleci.com/developer/orbs/orb/circleci/ruby
  ruby: circleci/ruby@2.5.3

jobs:
  test:
    resource_class: medium
    parameters:
      ruby-version:
        type: string
    docker:
      - image: cimg/ruby:<< parameters.ruby-version >>
    steps:
      - checkout
      - ruby/install-deps:
          key: gems-v1-ruby<< parameters.ruby-version >>
      - run:
          name: Run specs with Plur
          command: |
            set -euo pipefail
            version=$(sed -n 's/^"github:rsanheim\/plur" = "\([^"]*\)"$/\1/p' mise.toml)
            test -n "$version"
            archive="plur_${version}_linux_amd64.tar.gz"
            mkdir -p tmp/plur-install tmp/bin
            cd tmp/plur-install
            curl -fsSLO "https://github.com/rsanheim/plur/releases/download/v${version}/${archive}"
            curl -fsSLO "https://github.com/rsanheim/plur/releases/download/v${version}/plur_${version}_checksums.txt"
            awk -v file="$archive" '$2 == file { print }' "plur_${version}_checksums.txt" | sha256sum -c -
            tar -xzf "$archive"
            install -m 755 "plur_${version}_linux_amd64/plur" ../bin/plur
            cd ../..
            tmp/bin/plur spec
      - run:
          name: Run fake gem specs
          command: bundle exec rake spec:fake_gem

  lint:
    resource_class: medium
    docker:
      - image: cimg/ruby:4.0
    steps:
      - checkout
      - ruby/install-deps:
          key: gems-v1-ruby4.0
      - run:
          name: Run Standard Ruby linter
          command: bundle exec rake standard

workflows:
  build:
    jobs:
      - test:
          matrix:
            parameters:
              ruby-version: ["3.2", "3.3", "3.4", "4.0"]
      - lint
